[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-openshell-nano-miles"
version = "0.1.0"
description = "A minimal, decoupled Agentic RL training and sampling closed loop combining nano-miles and nano-openshell with dual-GPU separation, rootless process isolation, and CUDA IPC hot sync"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cs-ai-li" }]
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "sglang>=0.4.0",
    "requests>=2.28.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/cs-ai-li/nano-openshell-nano-miles"
"Blog Post" = "https://my-blog-tau-nine-28.vercel.app/posts/building-agentic-rl-nano-miles-openshell/"

[tool.setuptools.packages.find]
where = ["."]
include = ["nano_miles*"]

[tool.pytest.ini_options]
pythonpath = ["."]
